apiVersion: v1
kind: Namespace
metadata:
  name: zaraz
---
apiVersion: v1
kind: Secret
metadata:
  name: zaraz-secrets
  namespace: zaraz
type: Opaque
stringData:
  DB_PASSWORD: "cc46bdd3481f30ce"
  JWT_SECRET: "dbb3b73b11df85adec781f0e29f6a70ba324c63d64a9d0a3e047c8313b6670aa"   # openssl rand -hex 32
  ADMIN_PASSWORD: "84d9e231c17f6f69"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zaraz-config
  namespace: zaraz
data:
  NODE_ENV: "production"
  PORT: "4000"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: "zaraz"
  DB_USER: "zaraz_user"
  DB_POOL_MAX: "10"
  DB_SSL: "false"
  API_PUBLIC_URL: "https://zarazboutique.in"
  ALLOWED_ORIGINS: "https://zarazboutique.in"
  JWT_EXPIRES_IN: "7d"
  ADMIN_EMAIL: "admin@zarazboutique.in"
  ADMIN_NAME: "Store Admin"
  SEED_ON_START: "true"
  STORAGE_DRIVER: "local"
  UPLOAD_DIR: "/app/uploads"
  UPLOAD_MAX_MB: "5"
  PAYMENT_PROVIDER: "manual"
  PAYMENT_CURRENCY: "INR"
  PAYMENT_COD_ENABLED: "true"
  PAYMENT_UPI_ENABLED: "true"
  PAYMENT_CARD_ENABLED: "true"
  PAYMENT_UPI_VPA: "zarazboutique@upi"
  CONTACT_FORM_EMAIL: "support@zarazboutique.in"
  SHIPPING_FLAT_RATE: "0"
  SHIPPING_FREE_ABOVE: "0"
  RATE_LIMIT_MAX: "300"
  AUTH_RATE_LIMIT_MAX: "30"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: zaraz
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: zaraz
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
# ---------------- DB ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: zaraz
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO volume: never run two DB pods at once
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: zaraz-config, key: DB_USER } } }
            - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: zaraz-config, key: DB_NAME } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: zaraz-secrets, key: DB_PASSWORD } } }
            - { name: POSTGRES_INITDB_ARGS, value: "--encoding=UTF8 --locale=C" }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: db-data }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: zaraz
spec:
  selector: { app: db }
  ports:
    - port: 5432
---
# ---------------- API ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: zaraz
spec:
  replicas: 1
  strategy:
    type: Recreate          # uploads PVC is RWO
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: zaraz-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: zaraz-config }
          env:
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: zaraz-secrets, key: DB_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: zaraz-secrets, key: JWT_SECRET } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: zaraz-secrets, key: ADMIN_PASSWORD } } }
          volumeMounts:
            - { name: uploads, mountPath: /app/uploads }
          startupProbe:
            httpGet: { path: /api/health, port: 4000 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: uploads-data }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: zaraz
spec:
  selector: { app: api }
  ports:
    - port: 4000
---
# ---------------- WEB ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: zaraz
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: zaraz-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - { name: API_UPSTREAM, value: "http://api:4000" }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: zaraz
spec:
  selector: { app: web }
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zaraz
  namespace: zaraz
spec:
  ingressClassName: traefik
  rules:
    - host: zarazboutique.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
                