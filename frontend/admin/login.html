<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Sign In — Zaraz Boutique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/admin.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6d7d'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-style='italic' fill='%23e8d29a' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">Z</div>
      <h1>Zaraz Boutique</h1>
      <p>Admin console</p>
    </div>

    <div class="alert alert-error hidden" data-form-alert role="alert"></div>

    <form data-admin-login novalidate>
      <div class="field">
        <label for="admin-email">Email address</label>
        <input class="input" id="admin-email" name="email" type="email" required autocomplete="username" placeholder="admin@example.com" />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <input class="input" id="admin-password" name="password" type="password" required autocomplete="current-password" placeholder="Your password" />
        <div class="field-error"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:8px">Sign in to console</button>
    </form>

    <div class="login-hint">
      Credentials come from <code>ADMIN_EMAIL</code> / <code>ADMIN_PASSWORD</code> in your
      <code>.env</code>. If <code>ADMIN_PASSWORD</code> is blank, the password generated on
      first boot is printed once in the API logs.
    </div>
    <p class="small muted text-center" style="margin:16px 0 0">
      <a href="../index.html">← Back to storefront</a>
    </p>
  </div>

  <script src="assets/js/admin-api.js"></script>
  <script src="assets/js/admin-ui.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
