<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account — Zaraz Boutique</title>
  <meta name="description" content="Manage your Zaraz Boutique profile, orders and delivery addresses." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236b1f2e'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-style='italic' fill='%23e3c988' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div data-header></div>

  <main>
    <div class="container container-wide">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><span>My account</span>
      </nav>

      <div class="section-head left" style="margin-bottom:26px">
        <span class="eyebrow">Your Zaraz</span>
        <h1 style="font-size:clamp(1.8rem,3.4vw,2.5rem)">My account</h1>
      </div>

      <div data-account-root></div>
    </div>
  </main>

  <div data-footer></div>

  <!-- Reused address editor -->
  <div class="drawer-backdrop" data-address-backdrop></div>
  <aside class="drawer" data-address-panel aria-hidden="true" aria-label="Delivery address">
    <div class="drawer-head">
      <h3 data-address-title>Add delivery address</h3>
      <button class="icon-btn" type="button" data-address-close aria-label="Close address form">✕</button>
    </div>
    <form class="drawer-body" data-address-form novalidate>
      <div class="alert alert-error hidden" data-form-alert role="alert"></div>
      <input type="hidden" name="id" />
      <div class="field">
        <label for="ac-label">Address label</label>
        <input class="input" id="ac-label" name="label" placeholder="Home, Office…" value="Home" />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="ac-name">Full name <span class="req">*</span></label>
        <input class="input" id="ac-name" name="full_name" required />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="ac-phone">Phone <span class="req">*</span></label>
        <input class="input" id="ac-phone" name="phone" required placeholder="+91 98765 43210" />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="ac-line1">Address line 1 <span class="req">*</span></label>
        <input class="input" id="ac-line1" name="line1" required />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="ac-line2">Address line 2</label>
        <input class="input" id="ac-line2" name="line2" />
        <div class="field-error"></div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="ac-city">City <span class="req">*</span></label>
          <input class="input" id="ac-city" name="city" required />
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="ac-state">State <span class="req">*</span></label>
          <input class="input" id="ac-state" name="state" required />
          <div class="field-error"></div>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="ac-postal">PIN code <span class="req">*</span></label>
          <input class="input" id="ac-postal" name="postal_code" required />
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="ac-country">Country</label>
          <input class="input" id="ac-country" name="country" value="India" />
          <div class="field-error"></div>
        </div>
      </div>
      <label class="check" style="margin-bottom:18px">
        <input type="checkbox" name="is_default" /> Set as my default delivery address
      </label>
      <button class="btn btn-primary btn-block" type="submit">Save address</button>
    </form>
  </aside>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/pages/account.js"></script>
</body>
</html>
