<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Zaraz Boutique</title>
  <meta name="description" content="Choose a delivery address and payment method to place your Zaraz Boutique order." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6d7d'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-style='italic' fill='%23e8d29a' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div data-header></div>

  <main>
    <div class="container container-wide">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span>
        <a href="cart.html">Bag</a><span class="sep">/</span><span>Checkout</span>
      </nav>

      <div class="steps">
        <div class="step active"><span class="step-num">1</span> Delivery</div>
        <div class="step-sep"></div>
        <div class="step active"><span class="step-num">2</span> Payment</div>
        <div class="step-sep"></div>
        <div class="step"><span class="step-num">3</span> Confirmation</div>
      </div>

      <div data-checkout-root></div>
    </div>
  </main>

  <!-- Address form lives in a dialog so it can be reused for add and edit -->
  <div class="drawer-backdrop" data-address-backdrop></div>
  <aside class="drawer" data-address-panel aria-hidden="true" aria-label="Delivery address">
    <div class="drawer-head">
      <h3 data-address-title>Add delivery address</h3>
      <button class="icon-btn" type="button" data-address-close aria-label="Close address form">✕</button>
    </div>
    <form class="drawer-body" data-address-form novalidate>
      <div class="alert alert-error hidden" data-form-alert role="alert"></div>
      <input type="hidden" name="id" />
      <div class="field">
        <label for="addr-label">Address label</label>
        <input class="input" id="addr-label" name="label" placeholder="Home, Office…" value="Home" />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="addr-name">Full name <span class="req">*</span></label>
        <input class="input" id="addr-name" name="full_name" required autocomplete="name" />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="addr-phone">Phone <span class="req">*</span></label>
        <input class="input" id="addr-phone" name="phone" required autocomplete="tel" placeholder="+91 98765 43210" />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="addr-line1">Address line 1 <span class="req">*</span></label>
        <input class="input" id="addr-line1" name="line1" required autocomplete="address-line1" />
        <div class="field-error"></div>
      </div>
      <div class="field">
        <label for="addr-line2">Address line 2</label>
        <input class="input" id="addr-line2" name="line2" autocomplete="address-line2" />
        <div class="field-error"></div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="addr-city">City <span class="req">*</span></label>
          <input class="input" id="addr-city" name="city" required autocomplete="address-level2" />
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="addr-state">State <span class="req">*</span></label>
          <input class="input" id="addr-state" name="state" required autocomplete="address-level1" />
          <div class="field-error"></div>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="addr-postal">PIN code <span class="req">*</span></label>
          <input class="input" id="addr-postal" name="postal_code" required autocomplete="postal-code" />
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="addr-country">Country</label>
          <input class="input" id="addr-country" name="country" value="India" />
          <div class="field-error"></div>
        </div>
      </div>
      <label class="check" style="margin-bottom:18px">
        <input type="checkbox" name="is_default" /> Set as my default delivery address
      </label>
      <button class="btn btn-primary btn-block" type="submit" data-address-submit>Save address</button>
    </form>
  </aside>

  <div data-footer></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/pages/checkout.js"></script>
</body>
</html>
