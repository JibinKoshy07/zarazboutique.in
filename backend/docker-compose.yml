services:
  postgres:
    image: postgres:16-alpine
    container_name: zaraz-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: zaraz_user
      POSTGRES_PASSWORD: nsjt54ewr
      POSTGRES_DB: zaraz_db

    ports:
      - "5432:5432"

    volumes:
      - zaraz_postgres_data:/var/lib/postgresql/data

volumes:
  zaraz_postgres_data:
